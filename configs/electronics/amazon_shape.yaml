intervention:
  name: exact_mean_preserving_polarization
  pair_maps:
    2,2:
    - 1
    - 3
    2,3:
    - 1
    - 4
    2,4:
    - 1
    - 5
    3,3:
    - 1
    - 5
    3,4:
    - 2
    - 5
    4,4:
    - 3
    - 5
  feasibility_rule: Both experimental_A and experimental_B must admit three disjoint
    transformable rating pairs. Treatment block is randomized 50/50.
  selection_rule: Choose three disjoint transformable pairs using a seed-randomized
    backtracking order; selection never uses W1, JS, or any detector score.
discrepancies:
  w1: 1D Wasserstein-1 on support {1,2,3,4,5}
  js: Jensen-Shannon divergence in nats
  abs_mean: absolute difference between block mean and reference mean

shared_data:
  root: ../amazon_preprocess/electronics
  roles_file: stage2/electronics_roles.items.jsonl.gz
  reference_histograms: stage2/electronics_reference_histograms.csv
  reference_freeze: stage3/electronics_reference_freeze.json
